<app-modal-dialog title="Approve blood group" [dismissible]="!busy()" (closed)="cancelled.emit()">
  @let i = item();

  <p>
    <strong>{{ i.donorFullName ?? 'This donor' }}</strong> declared <strong>{{ labels[i.declaredBloodGroup] }}</strong>.
    Select the blood group you have confirmed. Donors are matched to patients by this confirmed group, and the
    donor sees it on their blood group page.
  </p>

  @if (error()) {
    <div class="alert alert-danger" role="alert">{{ error() }}</div>
  }

  <form id="approve-form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <app-form-field label="Confirmed blood group" controlId="approve-group" [error]="fieldError()">
      <select
        id="approve-group"
        class="form-select"
        formControlName="verifiedBloodGroup"
        autofocus
        [class.is-invalid]="!!fieldError()"
      >
        <option value="" disabled>Select</option>
        @for (option of options; track option) {
          <option [value]="option">{{ labels[option] }}</option>
        }
      </select>
    </app-form-field>
  </form>

  <ng-container ngProjectAs="[dialog-footer]">
    <button type="button" class="btn btn-outline-secondary" [disabled]="busy()" (click)="cancelled.emit()">
      Cancel
    </button>
    <button type="submit" form="approve-form" class="btn btn-success" [disabled]="busy()">
      @if (busy()) {
        <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>Approving...
      } @else {
        Approve
      }
    </button>
  </ng-container>
</app-modal-dialog>
